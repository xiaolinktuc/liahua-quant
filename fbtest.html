<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>备源切换验证</title></head>
<body style="background:#0d1117;color:#dde4ee;font-family:Consolas,monospace;font-size:13px;padding:20px">
<h2 style="margin:0 0 8px">Liahua Quant 数据层验证 v3</h2>
<div style="color:#9aa7ba;margin-bottom:10px;line-height:1.8">
  <div>本页调用真实数据层函数, 覆盖三大功能域的全部关键接口: 行情域(A股/美股/期货K线、五分钟线、分时、快照)、搜索域(中文名与代码两种关键词)、列表域(A股行情列表)、资讯域(市场快讯双源、个股公告)。数据层采用三级回退: 东方财富主源、腾讯备源、新浪备源, 任一可用即返回, 测试期间主源处于临时限流属正常场景。</div>
  <div>结果按编号逐行写入下方输出区并缓存, 全部完成后刷新页面可直接回看。FAIL 行会附失败原因。八=A股分时(含均价/成交量), 九=美股分时, 十=市场快讯(东财或新浪), 十一=个股公告。</div>
</div>
<pre id="out">测试运行中, 请稍候几秒后刷新本页...</pre>
<script>
  var cached = null
  try { cached = sessionStorage.getItem('fbResult6') } catch (e) {}
  if (cached) {
    document.getElementById('out').textContent = cached
    if (cached.indexOf('全部完成') >= 0) document.title = '数据验证v3: 结果已就绪'
  }
</script>
<script type="module">
  var done = cached && cached.indexOf('全部完成') >= 0
  if (!done) {
    var lines = []
    var log = (s) => { lines.push(s); try { sessionStorage.setItem('fbResult6', lines.join('\n')) } catch (e) {} document.getElementById('out').textContent = lines.join('\n') }
    log('开始测试...')
    var t0 = Date.now()
    try {
      const em = await import('/src/api/eastmoney.ts')
      const news = await import('/src/api/news.ts')
      try {
        const bars = await em.fetchKLine('1.600519', { period: '1d', count: 300 })
        log('[1] A股日线 茅台: ' + bars.length + '根, 末close=' + bars.at(-1).close)
      } catch (e) { log('[1] A股日线 FAIL: ' + e.message) }
      try {
        const us = await em.fetchKLine('105.AAPL', { period: '1d', count: 300 })
        log('[2] 美股日线 AAPL: ' + us.length + '根, 末close=' + us.at(-1).close)
      } catch (e) { log('[2] 美股日线 FAIL: ' + e.message) }
      try {
        const m5 = await em.fetchKLine('1.600519', { period: '5m', count: 200 })
        log('[3] A股5分钟线: ' + m5.length + '根')
      } catch (e) { log('[3] A股5分钟线 FAIL: ' + e.message) }
      try {
        const f = await em.fetchKLine('113.aum', { period: '1d', count: 120 })
        log('[4] 期货日线 沪金主连: ' + f.length + '根, 末close=' + f.at(-1).close)
      } catch (e) { log('[4] 期货日线 FAIL: ' + e.message) }
      try {
        const q = await em.fetchQuote('1.600519')
        log('[5] 快照: price=' + q.price + ' 涨跌=' + q.changeRate.toFixed(2) + '%')
      } catch (e) { log('[5] 快照 FAIL: ' + e.message) }
      try {
        const r = await em.searchSecurity('北方稀土')
        log('[6] 搜索"北方稀土": ' + (r.length ? r.slice(0, 2).map(m => m.name + '(' + m.secid + ')').join(' | ') : '无结果'))
      } catch (e) { log('[6] 搜索 FAIL: ' + e.message) }
      try {
        const c = await em.fetchScreenerList({ category: 'cn', pageSize: 50, page: 1 })
        log('[7] A股列表: ' + c.items.length + '条, 首条=' + c.items[0].name + ' ' + c.items[0].changeRate.toFixed(2) + '%')
      } catch (e) { log('[7] A股列表 FAIL: ' + e.message) }
      try {
        const d = await em.fetchIntraday('1.600519')
        const p = d.points
        const okAvg = p.some(x => Number.isFinite(x.avgPrice))
        const volSum = p.reduce((s, x) => s + (Number.isFinite(x.volume) ? x.volume : 0), 0)
        log('[8] A股分时: 交易日=' + d.date + ' 昨收=' + d.preClose + ' 点数=' + p.length + ' 均价有效=' + okAvg + ' 量柱总量=' + (volSum / 1e4).toFixed(1) + '万股 末价=' + p.at(-1).price)
      } catch (e) { log('[8] A股分时 FAIL: ' + e.message) }
      try {
        const d2 = await em.fetchIntraday('105.AAPL')
        log('[9] 美股分时: 点数=' + d2.points.length + ' 昨收=' + d2.preClose)
      } catch (e) { log('[9] 美股分时 FAIL: ' + e.message) }
      try {
        const n1 = await news.fetchMarketNews(10)
        log('[10] 市场快讯: ' + n1.length + '条, 首=' + (n1[0] ? n1[0].source + ' | ' + n1[0].title.slice(0, 30) : '-'))
      } catch (e) { log('[10] 市场快讯 FAIL: ' + e.message) }
      try {
        const n2 = await news.fetchStockAnnouncements('600519', 5)
        log('[11] 茅台公告: ' + n2.length + '条, 首=' + (n2[0] ? n2[0].time + ' | ' + n2[0].title.slice(0, 28) : '-'))
      } catch (e) { log('[11] 公告 FAIL: ' + e.message) }
      log('=== 全部完成, 用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's, 刷新页面可重看结果 ===')
    } catch (e) {
      log('模块加载 FAIL: ' + e.message)
    }
  }
</script>
</body>
</html>
