<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>推荐压测验证</title></head>
<body style="background:#0d1117;color:#dde4ee;font-family:Consolas,monospace;font-size:13px;padding:20px">
<h2 style="margin:0 0 8px">明日推荐 · 节流修复后压测 (30只完整流程)</h2>
<div style="color:#9aa7ba;line-height:1.8;margin-bottom:10px">
  <div>模拟真实场景: 从A股列表接口拉真实候选50只, 按 generateTomorrowPicks 默认参数(初筛30只→逐只拉80日K线→评分)完整跑一遍。验证腾讯节流器(280ms间隔)是否消除批量拒绝。预期: 成功率接近100%, 总耗时约15~25秒。完成后缓存结果。</div>
</div>
<pre id="out">运行中, 约25秒后刷新本页...</pre>
<script>
  var cached = null
  try { cached = sessionStorage.getItem('fbPick3') } catch (e) {}
  if (cached) {
    document.getElementById('out').textContent = cached
    if (cached.indexOf('全部完成') >= 0) document.title = '压测: 已就绪'
  }
</script>
<script type="module">
  var done = cached && cached.indexOf('全部完成') >= 0
  if (!done) {
    var lines = ['开始...']
    var log = (s) => { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); try { sessionStorage.setItem('fbPick3', lines.join('\n')) } catch (e) {} }
    const { fetchScreenerList } = await import('/src/api/eastmoney.ts')
    const { generateTomorrowPicks } = await import('/src/api/prediction.ts')
    var t0 = Date.now()
    try {
      var list = await fetchScreenerList({ category: 'cn', pageSize: 50, page: 1, sortField: 'changeRate', sortOrder: 'desc' })
      log('[1] 候选列表: ' + list.items.length + '条 (前3: ' + list.items.slice(0,3).map(function(i){return i.name}).join(',') + ')')
      var picks = await generateTomorrowPicks(list.items, { poolSize: 30, topN: 10, onProgress: function (d, t) { if (d % 10 === 0 || d === t) log('    进度 ' + d + '/' + t) } })
      var st = picks.__stat || {}
      log('[2] 评分完成: ' + picks.length + ' 只入榜 | 诊断: 新股跳过=' + (st.skipped || 0) + ' 拉取失败=' + (st.failed || 0) + ' 评分0分=' + (st.zero || 0))
      picks.forEach(function (p, i) {
        log('    #' + (i + 1) + ' ' + p.snapshot.name + '(' + p.snapshot.code + ') 星级' + p.stars + ' 得分' + p.score + ' [' + p.reasons.join('/') + ']')
      })
      log('[3] 总耗时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's')
      log('全部完成')
      document.title = '压测: 已就绪'
    } catch (e) {
      log('FAIL: ' + e.message)
      log('全部完成')
    }
  }
</script>
</body>
</html>
